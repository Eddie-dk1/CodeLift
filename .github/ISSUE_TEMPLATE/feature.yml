name: Feature request
description: Suggest a CodeLift workflow or compatibility improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What extraction task cannot be completed today?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Include a sanitized import/config example and the desired result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
