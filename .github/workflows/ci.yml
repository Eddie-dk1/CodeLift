name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack and install without pnpm
        shell: bash
        run: |
          tarball=$(cd packages/cli && npm pack --silent)
          mkdir -p /tmp/codelift-package-smoke
          cd /tmp/codelift-package-smoke
          npm install "$GITHUB_WORKSPACE/packages/cli/$tarball" --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/codelift --version
          ./node_modules/.bin/codelift doctor "$GITHUB_WORKSPACE/fixtures/node-library" --entry src/index.ts --format json
          ./node_modules/.bin/codelift inspect src/index.ts --project "$GITHUB_WORKSPACE/fixtures/node-esm-basic" --format json
          node --input-type=module --eval 'const api = await import("codelift-cli/core"); for (const name of ["analyzeProject", "createExtractionPlan", "exportPackage", "verifyPackage"]) if (typeof api[name] !== "function") throw new Error(`Missing core export: ${name}`);'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  export-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Analyze, export, build, and smoke test Node and React fixtures
        run: pnpm test:export-smoke

  quality-gate:
    name: Quality gate
    if: always()
    needs: [verify, package-smoke, e2e, export-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          EXPORT_SMOKE_RESULT: ${{ needs.export-smoke.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$E2E_RESULT" = success
          test "$EXPORT_SMOKE_RESULT" = success
