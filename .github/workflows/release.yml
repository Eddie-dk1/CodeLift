name: Release package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish codelift-cli to npm after all checks pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: npm pack --dry-run
        working-directory: packages/cli
      - if: ${{ inputs.publish }}
        run: npm publish --provenance --access public
        working-directory: packages/cli
